<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking - Mundial 2026</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/forms.css">
<link rel="stylesheet" href="assets/css/typography.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="sidebar-logo">Mundial 2026</div>
<nav class="sidebar-nav" id="sidebar-nav"></nav>
</aside>
<div class="main-wrapper">
<header class="topbar">
<div></div>
<div class="topbar-user" id="topbar-user"></div>
</header>
<main class="content">
<h1>Ranking de Palpites</h1>
<div class="card">
<table>
<thead><tr><th>#</th><th>Utilizador</th><th>Palpites</th><th>Pontos</th></tr></thead>
<tbody id="ranking-body"></tbody>
</table>
</div>
</main>
</div>
</div>

<script src="assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/layout.js"></script>
<script>
if (!estaLogado()) redirectLogin();
renderLayout();

(async () => {
  const users = await supabaseSelect('utilizadores', 'idutilizadores, nome_utilizador', {}, 'idutilizadores');
  const ranking = [];
  for (const u of users || []) {
    const palpites = await supabaseSelect('palpites', 'pontos', { id_utilizador: u.idutilizadores });
    let total = 0;
    for (const p of palpites || []) total += p.pontos || 0;
    ranking.push({ nome: u.nome_utilizador, total, palpites: (palpites || []).length });
  }
  ranking.sort((a, b) => b.total - a.total);

  document.getElementById('ranking-body').innerHTML = ranking.map((r, i) =>
    '<tr><td>' + (i + 1) + '</td><td>' + esc(r.nome) + '</td><td>' + r.palpites + '</td><td><strong>' + r.total + '</strong></td></tr>'
  ).join('');
})();
</script>
</body>
</html>
