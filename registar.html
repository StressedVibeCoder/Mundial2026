<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registar - Mundial 2026</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/forms.css">
<link rel="stylesheet" href="assets/css/typography.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="auth-layout">
<div class="auth-card">
<h1>Registar</h1>
<div id="register-error" class="msg msg-error" style="display:none"></div>
<form id="register-form">
<div class="form-group">
<label for="username">Username:</label>
<input type="text" id="username" required>
</div>
<div class="form-group">
<label for="email">Email:</label>
<input type="email" id="email" required>
</div>
<div class="form-group">
<label for="password">Password:</label>
<input type="password" id="password" required>
</div>
<div class="form-group">
<label for="confirm_password">Confirmar Password:</label>
<input type="password" id="confirm_password" required>
</div>
      <button type="submit" class="btn-primary">Registar</button>
</form>
<div class="auth-links">
<a href="index.html">Voltar ao Início</a>
<a href="login.html">Login</a>
</div>
</div>
</div>

<script src="assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script>
if (estaLogado()) redirectHome();

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  if (password !== confirm) {
    const el = document.getElementById('register-error');
    el.textContent = 'As passwords não coincidem.';
    el.style.display = 'block';
    return;
  }
  if (!username || !email || !password) {
    const el = document.getElementById('register-error');
    el.textContent = 'Preencha todos os campos.';
    el.style.display = 'block';
    return;
  }

  const err = await register(username, email, password);
  if (err) {
    const el = document.getElementById('register-error');
    el.textContent = err;
    el.style.display = 'block';
  } else {
    location.href = 'login.html';
  }
});
</script>
</body>
</html>
